name: Validate PartScope importer

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/test_importer.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/test_importer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile importer and tests
        run: python -m py_compile tools/splitter.py tools/test_splitter.py
      - name: Run importer join tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
