name: Check PartScope build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test TecDoc importer
        run: |
          python -m py_compile tools/splitter.py tools/test_splitter.py
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Build
        run: bun run build
