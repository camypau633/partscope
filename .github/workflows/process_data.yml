name: Import TecDoc source tables

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write

concurrency:
  group: process-parts-data
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout PartScope
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check available runner storage
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          mkdir -p raw_data/2Q2018 raw_data/1Q2019

      - name: Download only required CSV files and image-path metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          SOURCES = {
              "2Q2018": {
                  "repo": "tecdocSQL/tecdocdatabase2Q2018",
                  "tables": (
                      "articles.csv", "suppliers.csv", "article_attributes.csv",
                      "article_cross_list.csv", "article_oe_numbers.csv",
                      "article_informations.csv", "manufacturers.csv", "models.csv",
                      "passengercars.csv", "passengercars_link_engines.csv", "engines.csv",
                  ),
              },
              "1Q2019": {
                  "repo": "tecdocSQL/tecdocdatabase1Q2019",
                  "tables": (
                      "articles.csv", "suppliers.csv", "article_mediainformation.csv",
                  ),
              },
          }

          def fetch(url, destination):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PartScope-data-import",
                           "Authorization": "Bearer " + os.environ.get("GH_TOKEN", "")},
              )
              with urllib.request.urlopen(request, timeout=60) as response, open(destination, "wb") as out:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)

          for label, config in SOURCES.items():
              repo = config["repo"]
              outdir = Path("raw_data") / label
              outdir.mkdir(parents=True, exist_ok=True)
              tree_url = "https://api.github.com/repos/" + repo + "/git/trees/main?recursive=1"
              tree_file = outdir / "tree.json"
              fetch(tree_url, tree_file)
              tree = json.loads(tree_file.read_text(encoding="utf-8"))
              if tree.get("truncated"):
                  raise SystemExit("GitHub tree response was truncated for " + repo)
              paths = [entry["path"] for entry in tree.get("tree", []) if entry.get("type") == "blob"]

              # This is only a text manifest of existing image paths; no image bytes are downloaded.
              if label == "1Q2019":
                  image_paths = sorted(path for path in paths if path.startswith("images/"))
                  (outdir / "images_manifest.txt").write_text(
                      "\n".join(image_paths) + ("\n" if image_paths else ""), encoding="utf-8"
                  )
                  print("Image paths indexed:", len(image_paths))

              for table in config["tables"]:
                  matching = [p for p in paths if p == table or p.startswith(table + ".")]
                  if not matching:
                      print("Optional table absent:", repo + "/" + table)
                      continue
                  matching.sort(key=lambda p: (0, int(p.rsplit(".", 1)[1]))
                                if p.rsplit(".", 1)[-1].isdigit() else (1, 0))
                  for path in matching:
                      dest = outdir / Path(path).name
                      if dest.exists() and dest.stat().st_size:
                          continue
                      url = "https://raw.githubusercontent.com/" + repo + "/main/" + path
                      print("Downloading", repo + "/" + path)
                      fetch(url, dest)

                  # Concatenate only split parts, in numeric order, then remove the parts.
                  chunks = [outdir / Path(p).name for p in matching
                            if Path(p).name.startswith(table + ".")]
                  if chunks:
                      combined = outdir / table
                      with combined.open("wb") as target:
                          for chunk in chunks:
                              with chunk.open("rb") as source:
                                  while True:
                                      block = source.read(1024 * 1024)
                                      if not block:
                                          break
                                      target.write(block)
                      for chunk in chunks:
                          chunk.unlink()
                      print("Combined", table, "from", len(chunks), "parts")

              tree_file.unlink(missing_ok=True)
          PY

      - name: Build compact JSON shards
        run: |
          set -euo pipefail
          python tools/splitter.py \
            --input raw_data \
            --output public/data \
            --clean-output

      - name: Validate generated shards
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(public/data/*.json)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::error::No JSON shards were generated."
            exit 1
          fi
          total_bytes=0
          for shard in "${shards[@]}"; do
            bytes=$(stat -c '%s' "$shard")
            total_bytes=$((total_bytes + bytes))
            if [ "$bytes" -ge 90000000 ]; then
              echo "::error::$(basename "$shard") is at least 90 MB."
              exit 1
            fi
          done
          echo "Shard count: ${#shards[@]}"
          echo "Total shard bytes: $total_bytes"
          if [ "$total_bytes" -ge 800000000 ]; then
            echo "::error::Generated catalogue is at least 800 MB; refusing to push it."
            exit 1
          fi

      - name: Commit generated shards to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --cached --quiet; then
            echo "Generated data is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Import TecDoc catalogue shards"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
