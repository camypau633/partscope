name: Process TecDoc parts data

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write

concurrency:
  group: process-parts-data
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout PartScope
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check runner storage
        run: |
          set -euo pipefail
          df -h .
          mkdir -p raw_data/2Q2018 raw_data/1Q2019

      - name: Download selected CSV tables and image-path manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import urllib.request
          from pathlib import Path

          SOURCES = {
              "2Q2018": {
                  "repo": "tecdocSQL/tecdocdatabase2Q2018",
                  "tables": (
                      "articles.csv", "suppliers.csv", "article_attributes.csv",
                      "article_informations.csv", "items_atributes.csv", "article_cross_list.csv",
                  ),
              },
              "1Q2019": {
                  "repo": "tecdocSQL/tecdocdatabase1Q2019",
                  "tables": ("articles.csv", "suppliers.csv", "article_mediainformation.csv"),
              },
          }

          def fetch(url, destination):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PartScope-data-import",
                      "Authorization": "Bearer " + os.environ.get("GH_TOKEN", ""),
                  },
              )
              with urllib.request.urlopen(request, timeout=90) as response, open(destination, "wb") as out:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)

          for label, config in SOURCES.items():
              repo = config["repo"]
              outdir = Path("raw_data") / label
              outdir.mkdir(parents=True, exist_ok=True)
              tree_file = outdir / "tree.json"
              fetch("https://api.github.com/repos/" + repo + "/git/trees/main?recursive=1", tree_file)
              tree = json.loads(tree_file.read_text(encoding="utf-8"))
              if tree.get("truncated"):
                  raise SystemExit("GitHub returned a truncated tree for " + repo)
              entries = {
                  item["path"]: item for item in tree.get("tree", [])
                  if item.get("type") == "blob"
              }
              paths = list(entries)

              selected = set()
              for table in config["tables"]:
                  selected.update(p for p in paths if p == table or p.startswith(table + "."))
              payload = sum(int(entries[p].get("size", 0)) for p in selected)
              free = shutil.disk_usage(".").free
              # Chunk assembly briefly needs source parts and the merged file.
              if payload > 9 * 1024**3 or payload * 1.6 > free - 2 * 1024**3:
                  raise SystemExit(
                      "Refusing download: selected tables for " + repo + " are about "
                      + str(round(payload / 1024**3, 2)) + " GiB and exceed the safe runner budget."
                  )
              print("Selected CSV size for", repo, ":", round(payload / 1024**3, 2), "GiB")

              if label == "1Q2019":
                  image_paths = sorted(p for p in paths if p.startswith("images/"))
                  (outdir / "images_manifest.txt").write_text(
                      "\n".join(image_paths) + ("\n" if image_paths else ""), encoding="utf-8"
                  )
                  print("Indexed image paths without downloading images:", len(image_paths))

              for table in config["tables"]:
                  matching = [p for p in paths if p == table or p.startswith(table + ".")]
                  if not matching:
                      print("Table not present in source; skipped:", repo + "/" + table)
                      continue
                  matching.sort(key=lambda p: (0, int(p.rsplit(".", 1)[1]))
                                if p.rsplit(".", 1)[-1].isdigit() else (1, 0))
                  for path in matching:
                      destination = outdir / Path(path).name
                      if destination.exists() and destination.stat().st_size:
                          continue
                      print("Downloading", repo + "/" + path)
                      fetch("https://raw.githubusercontent.com/" + repo + "/main/" + path, destination)

                  chunks = [outdir / Path(p).name for p in matching
                            if Path(p).name.startswith(table + ".")]
                  if chunks:
                      merged = outdir / table
                      with merged.open("wb") as target:
                          for chunk in chunks:
                              with chunk.open("rb") as source:
                                  shutil.copyfileobj(source, target, 1024 * 1024)
                      for chunk in chunks:
                          chunk.unlink()
                      print("Merged", table, "from", len(chunks), "numbered chunks")

              tree_file.unlink(missing_ok=True)
          PY

      - name: Validate source files and Python syntax
        run: |
          set -euo pipefail
          test -s raw_data/2Q2018/articles.csv
          test -s raw_data/2Q2018/suppliers.csv
          test -s raw_data/2Q2018/article_attributes.csv
          test -s raw_data/1Q2019/articles.csv
          test -s raw_data/1Q2019/article_mediainformation.csv
          test -s raw_data/1Q2019/images_manifest.txt
          if find raw_data -type f -regextype posix-extended -regex '.*\.csv\.[0-9]{3}' | grep -q .; then
            echo "::error::Numbered CSV chunks remain after merge."
            exit 1
          fi
          python -m py_compile tools/splitter.py tools/test_splitter.py
          python -m unittest discover -s tools -p 'test_*.py' -v
          echo "Selected TecDoc tables and importer join tests are ready."

      - name: Inspect real TecDoc table layout
        run: |
          set -euo pipefail
          python tools/splitter.py --input raw_data --inspect-layout | tee tecdoc-layout-report.txt
          test -s tecdoc-layout-report.txt

      - name: Build and validate a 1,000-part catalogue sample
        run: |
          set -euo pipefail
          python tools/splitter.py --input raw_data --output build-smoke/catalogue --limit 1000 --clean-output | tee catalogue-smoke-build.log
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build-smoke/catalogue")
          files = sorted(root.glob("*.json"))
          if not files:
              raise SystemExit("Smoke build produced no JSON shard files.")

          total = 0
          required = {"sku", "brand", "name", "specs", "technical_drawings", "analogues", "compatibility"}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not data:
                  raise SystemExit("Empty or invalid JSON shard: " + str(path))
              for key, record in data.items():
                  if not isinstance(record, dict) or not required.issubset(record):
                      raise SystemExit("Invalid part record in " + str(path) + ": " + key)
                  if record.get("sku") != key or not key:
                      raise SystemExit("SKU key mismatch in " + str(path) + ": " + key)
                  total += 1

          if total < 1000:
              raise SystemExit("Expected at least 1,000 records, got " + str(total))

          summary = [
              "status=success",
              "records=" + str(total),
              "json_shards=" + str(len(files)),
              "required_fields=" + ",".join(sorted(required)),
              "drawings_and_compatibility_are_not_claimed_verified_by_this_smoke_test",
          ]
          Path("catalogue-smoke-summary.txt").write_text("\\n".join(summary) + "\\n", encoding="utf-8")
          print("\\n".join(summary))
          PY

      - name: Upload catalogue smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partscope-catalogue-smoke-test
          path: |
            build-smoke/catalogue/*.json
            catalogue-smoke-build.log
            catalogue-smoke-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload TecDoc layout report
        uses: actions/upload-artifact@v4
        with:
          name: tecdoc-layout-report
          path: tecdoc-layout-report.txt
          if-no-files-found: error
          retention-days: 7
