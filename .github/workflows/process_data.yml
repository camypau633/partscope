name: Prepare TecDoc source CSVs (stage 1)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: process-parts-data
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout PartScope
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check available runner storage
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          mkdir -p raw_data/2Q2018 raw_data/1Q2019

      - name: Download only required CSV files and image-path metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          SOURCES = {
              "2Q2018": {
                  "repo": "tecdocSQL/tecdocdatabase2Q2018",
                  "tables": (
                      "articles.csv", "suppliers.csv", "article_attributes.csv",
                      "article_cross_list.csv", "article_oe_numbers.csv",
                      "article_informations.csv", "manufacturers.csv", "models.csv",
                      "passengercars.csv", "passengercars_link_engines.csv", "engines.csv",
                  ),
              },
              "1Q2019": {
                  "repo": "tecdocSQL/tecdocdatabase1Q2019",
                  "tables": (
                      "articles.csv", "suppliers.csv", "article_mediainformation.csv",
                  ),
              },
          }

          def fetch(url, destination):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PartScope-data-import",
                           "Authorization": "Bearer " + os.environ.get("GH_TOKEN", "")},
              )
              with urllib.request.urlopen(request, timeout=60) as response, open(destination, "wb") as out:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)

          for label, config in SOURCES.items():
              repo = config["repo"]
              outdir = Path("raw_data") / label
              outdir.mkdir(parents=True, exist_ok=True)
              tree_url = "https://api.github.com/repos/" + repo + "/git/trees/main?recursive=1"
              tree_file = outdir / "tree.json"
              fetch(tree_url, tree_file)
              tree = json.loads(tree_file.read_text(encoding="utf-8"))
              if tree.get("truncated"):
                  raise SystemExit("GitHub tree response was truncated for " + repo)
              entries = {
                  entry["path"]: entry
                  for entry in tree.get("tree", [])
                  if entry.get("type") == "blob"
              }
              paths = list(entries)

              # Preflight selected CSV sizes before downloading; keep a safety margin.
              selected_paths = set()
              for table in config["tables"]:
                  selected_paths.update(
                      path for path in paths
                      if path == table or path.startswith(table + ".")
                  )
              selected_bytes = sum(int(entries[path].get("size", 0)) for path in selected_paths)
              free_bytes = __import__("shutil").disk_usage(".").free
              safety_margin = 2 * 1024**3
              if selected_bytes > 10 * 1024**3 or selected_bytes > free_bytes - safety_margin:
                  raise SystemExit(
                      "Selected CSVs for " + repo + " need about "
                      + str(round(selected_bytes / 1024**3, 2)) + " GiB; "
                      "refusing to download with this runner disk limit."
                  )
              print("Selected CSV payload:", round(selected_bytes / 1024**3, 2), "GiB")

              # This is only a text manifest of existing image paths; no image bytes are downloaded.
              if label == "1Q2019":
                  image_paths = sorted(path for path in paths if path.startswith("images/"))
                  (outdir / "images_manifest.txt").write_text(
                      "\n".join(image_paths) + ("\n" if image_paths else ""), encoding="utf-8"
                  )
                  print("Image paths indexed:", len(image_paths))

              for table in config["tables"]:
                  matching = [p for p in paths if p == table or p.startswith(table + ".")]
                  if not matching:
                      print("Optional table absent:", repo + "/" + table)
                      continue
                  matching.sort(key=lambda p: (0, int(p.rsplit(".", 1)[1]))
                                if p.rsplit(".", 1)[-1].isdigit() else (1, 0))
                  for path in matching:
                      dest = outdir / Path(path).name
                      if dest.exists() and dest.stat().st_size:
                          continue
                      url = "https://raw.githubusercontent.com/" + repo + "/main/" + path
                      print("Downloading", repo + "/" + path)
                      fetch(url, dest)

                  # Concatenate only split parts, in numeric order, then remove the parts.
                  chunks = [outdir / Path(p).name for p in matching
                            if Path(p).name.startswith(table + ".")]
                  if chunks:
                      combined = outdir / table
                      with combined.open("wb") as target:
                          for chunk in chunks:
                              with chunk.open("rb") as source:
                                  while True:
                                      block = source.read(1024 * 1024)
                                      if not block:
                                          break
                                      target.write(block)
                      for chunk in chunks:
                          chunk.unlink()
                      print("Combined", table, "from", len(chunks), "parts")

              tree_file.unlink(missing_ok=True)
          PY

      - name: Validate downloaded source tables (stage 1 only)
        run: |
          set -euo pipefail
          test -s raw_data/2Q2018/articles.csv
          test -s raw_data/2Q2018/article_attributes.csv
          test -s raw_data/2Q2018/suppliers.csv
          test -s raw_data/1Q2019/articles.csv
          test -s raw_data/1Q2019/article_mediainformation.csv

          if find raw_data -type f -regextype posix-extended -regex '.*\.csv\.[0-9]{3}' | grep -q .; then
            echo "::error::Split CSV chunks remain after assembly."
            exit 1
          fi

          echo "Downloaded and assembled CSV tables:"
          find raw_data -type f -name '*.csv' -printf '%p (%s bytes)\n' | sort
          echo "Image-path manifest:"
          wc -l raw_data/1Q2019/images_manifest.txt
          echo "Stage 1 complete. The splitter is intentionally not run until its real TecDoc joins are implemented and tested."
