name: Crawl Toyota-Lexus Japan EPC

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum catalog pages to process in this run (0 = unlimited)"
        required: true
        default: "200"
        type: string
      delay_min:
        description: "Minimum delay between requests in seconds"
        required: true
        default: "1.5"
        type: string
      delay_max:
        description: "Maximum delay between requests in seconds"
        required: true
        default: "3.5"
        type: string

permissions:
  contents: write

concurrency:
  group: partscope-toyota-epc-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Run resumable Toyota/Lexus Japan crawler
        run: |
          python -m py_compile tools/crawl_catcar.py
          python tools/crawl_catcar.py \
            --max-pages "${{ inputs.max_pages }}" \
            --delay-min "${{ inputs.delay_min }}" \
            --delay-max "${{ inputs.delay_max }}"

      - name: Commit generated SKU shards and crawl state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json progress.json
          if git diff --cached --quiet; then
            echo "No new catalog data to commit."
            exit 0
          fi
          git commit -m "Import Toyota/Lexus Japan EPC data"
          git push origin main
