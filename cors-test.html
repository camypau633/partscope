<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatCar connection test</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;background:#111827;color:#f9fafb}
    h1{font-size:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:16px;border-radius:8px}
    button{padding:12px 18px;border:0;border-radius:8px;background:#f59e0b;color:#111827;font-weight:700;font-size:16px}
    .muted{color:#9ca3af}
  </style>
</head>
<body>
  <h1>Проверка прямого доступа к CatCar</h1>
  <p>Тест отправляет запрос из GitHub Pages непосредственно на www.catcar.info. PartScope и прокси не изменяются.</p>
  <button id="run">Запустить проверку</button>
  <p id="status" class="muted">Проверка ещё не запускалась.</p>
  <pre id="result">Здесь появится результат.</pre>
  <script>
    const button = document.getElementById("run");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    button.addEventListener("click", async () => {
      button.disabled = true;
      statusEl.textContent = "Отправляю запрос…";
      resultEl.textContent = "Ожидаю ответ до 15 секунд.";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch("https://www.catcar.info/", {
          method: "GET",
          mode: "cors",
          credentials: "omit",
          signal: controller.signal,
          headers: { "Accept": "text/html,application/xhtml+xml" }
        });
        const body = await response.text();
        statusEl.textContent = "Браузер смог прочитать HTTP-ответ.";
        resultEl.textContent = "HTTP: " + response.status + " " + response.statusText +
          "\nДлина ответа: " + body.length + " символов" +
          "\nНачало ответа:\n" + body.slice(0, 500);
      } catch (error) {
        statusEl.textContent = "Браузер не смог прочитать ответ CatCar.";
        resultEl.textContent = "Тип ошибки: " + error.name +
          "\nСообщение: " + error.message +
          "\n\nЕсли здесь TypeError / Failed to fetch, это может быть CORS или сетевая ошибка. По одному этому сообщению отличить их нельзя.";
      } finally {
        clearTimeout(timer);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
